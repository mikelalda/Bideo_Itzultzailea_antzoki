[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

; ---------------------------------------------------------------------------
; Whisper API - Speech to Text (interno, puerto 8001)
; Su app.py arranca uvicorn internamente y lee HOST/PORT del entorno.
; ---------------------------------------------------------------------------
[program:whisper-api]
directory=/app/services/whisper_API
command=/opt/venv/whisper/bin/python app.py
environment=HOST="0.0.0.0",PORT="8001",DEVICE="cpu",BATCH_SIZE="8",MAX_FILE_SIZE_MB="200",MODEL_ID="xezpeleta/whisper-large-v3-eu"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=10
priority=10

; ---------------------------------------------------------------------------
; aHoTTS API - Text to Speech (interno, puerto 8002)
; AHOTTS_BASE_PATH se redirige porque en este contenedor no vive en /app
; sino en /app/services/aHoTTS_API/aHoTTS (a diferencia de su Dockerfile original).
; ---------------------------------------------------------------------------
[program:ahotts-api]
directory=/app/services/aHoTTS_API
command=/opt/venv/ahotts/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8002
environment=PYTHONUNBUFFERED="1",MAX_TEXT_LENGTH="5000",AHOTTS_BASE_PATH="/app/services/aHoTTS_API/aHoTTS"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=10
priority=10

; ---------------------------------------------------------------------------
; Orchestrator - Web UI + pipeline (puerto 7860, el que expone el Space)
; Se arranca explicitamente en 7860 en vez de los 5000 originales del
; docker-compose, porque HF Spaces (SDK Docker) espera app_port=7860.
; ---------------------------------------------------------------------------
[program:orchestrator]
directory=/app
command=/opt/venv/orchestrator/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 7860
environment=WHISPER_API_URL="http://localhost:8001",AHOTTS_API_URL="http://localhost:8002"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startsecs=10
priority=20
